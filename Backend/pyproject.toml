[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-nat-autogen"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "nvidia-nat",
  "openai>=1.0.0",
  # nvidia-nat-core pins NumPy 2.x; older pyarrow wheels fail with AttributeError: _ARRAY_API not found
  "pyarrow>=17.0.0",
  # SciPy <1.13 wheels target NumPy 1.x; mismatch causes ValueError: numpy.dtype size changed
  "scipy>=1.13.0",
  "pandas",
  "sqlalchemy",
  "pyodbc",
  "pydantic",
  "pyyaml",
  "httpx"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.'nat.plugins']
unified_nat_autogen = "unified_nat_autogen.register"